<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10-STEP 영어 연습지 생성기 (AI)</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
<style>
:root{ --navy:#1a3a5c; --blue:#2e6da4; --orange:#b5532a; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif; color:#1a1a1a; background:#eef1f5; line-height:1.6; }
header.top{ background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
header.top h1{ font-size:18px; margin:0; }
header.top .sub{ font-size:12px; opacity:.85; }
.wrap{ max-width:1200px; margin:18px auto; padding:0 16px; display:grid; grid-template-columns:minmax(0,450px) 1fr; gap:18px; }
@media(max-width:920px){ .wrap{ grid-template-columns:1fr; } }
.card{ background:#fff; border:1px solid #dde3ea; border-radius:10px; padding:16px 16px 20px; }
.stepnum{ display:inline-block; background:var(--blue); color:#fff; border-radius:20px; font-size:11px; padding:2px 10px; margin-right:8px; }
.card h2{ font-size:15px; color:var(--navy); margin:0 0 6px; }
.sec{ border-top:1px solid #eef1f4; margin-top:16px; padding-top:14px; }
label{ display:block; font-size:12.5px; font-weight:700; color:#31465c; margin:10px 0 4px; }
.hint{ font-weight:400; color:#8a97a5; font-size:11.5px; }
input[type=text], input[type=password], textarea{ width:100%; border:1px solid #cfd8e2; border-radius:7px; padding:8px 10px; font-size:13px; font-family:inherit; resize:vertical; }
textarea{ min-height:70px; line-height:1.5; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.file{ font-size:12px; margin-top:4px; }
.btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
button{ cursor:pointer; border:0; border-radius:8px; padding:11px 16px; font-size:13.5px; font-weight:700; font-family:inherit; }
.accent{ background:var(--orange); color:#fff; }
.ghost{ background:#eaf1f8; color:var(--navy); }
.msg{ padding:9px 12px; border-radius:7px; font-size:12.5px; margin-top:10px; display:none; }
.msg.err{ background:#fdecea; color:#b3261e; border:1px solid #f4c7c3; }
.msg.ok{ background:#eaf6ec; color:#1e7e34; border:1px solid #c3e6cb; }
.msg.load{ background:#eef3f8; color:var(--navy); border:1px solid #cdd9e5; }
details summary{ cursor:pointer; font-weight:700; color:var(--blue); font-size:12.5px; }
.previewhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
.previewhead .t{ font-size:14px; font-weight:700; color:var(--navy); }
#sheet{ background:#fff; border:1px solid #dde3ea; border-radius:10px; padding:20px; }
.doctitle{ text-align:center; border-bottom:2.5px solid var(--navy); padding-bottom:8px; margin-bottom:6px; }
.doctitle h1{ font-size:20px; margin:0; color:var(--navy); }
.doctitle .sub{ font-size:12px; color:#555; margin-top:4px; }
.examhead{ border:1px solid #cdd9e5; background:#f2f7fc; border-radius:6px; padding:10px 14px; margin:10px 0 4px; font-size:12px; color:#243b52; }
.examhead b{ color:var(--navy); }
.examhead .line{ margin:2px 0; }
.rulebox{ border:1px solid #c9c9c9; background:#f7f9fb; border-radius:6px; padding:9px 13px; font-size:11px; color:#333; margin:8px 0 6px; }
.rulebox b{ color:var(--navy); }
.phead{ font-size:16px; font-weight:bold; color:#fff; background:var(--navy); padding:7px 12px; border-radius:5px; margin:14px 0 10px; }
.ptype{ font-size:12px; font-weight:normal; opacity:.9; }
.pass{ page-break-before:always; }
.pass:first-of-type{ page-break-before:avoid; }
.stepblk{ border:1px solid #dfe4ea; border-left:4px solid var(--blue); border-radius:4px; padding:11px 14px 14px; margin:13px 0; page-break-inside:avoid; }
.stitle{ font-weight:bold; color:var(--blue); font-size:14px; margin-bottom:9px; padding-bottom:4px; border-bottom:1px dotted #cfdae6; }
.n{ font-weight:bold; color:var(--blue); margin-right:3px; }
.lab{ font-weight:bold; color:var(--orange); margin-right:4px; }
.ko{ color:#333; }
.s1row{ margin:9px 0; page-break-inside:avoid; }
.s2row{ margin:11px 0; page-break-inside:avoid; }
.s6row{ margin:15px 0; line-height:1.9; page-break-inside:avoid; }
.s10row{ margin:13px 0; page-break-inside:avoid; }
.wline{ border-bottom:1px solid #bbb; height:26px; margin:6px 0 3px; }
.para{ border:1px dashed #bbb; background:#fcfcfc; padding:11px 12px; border-radius:4px; line-height:2.0; white-space:pre-wrap; }
.fixrow{ margin-top:12px; }
.wb2{ display:inline-block; width:86px; border-bottom:1px solid #888; height:15px; }
.given{ background:#eef3f8; border:1px solid #cdd9e5; border-radius:4px; padding:8px 11px; margin-bottom:9px; }
.chunk{ margin:8px 0; padding:9px 11px; background:#fafbfc; border:1px solid #e3e7eb; border-radius:4px; line-height:1.8; page-break-inside:avoid; }
.orderline{ margin-top:11px; font-weight:bold; }
.boxline{ margin:7px 0 3px; }
.wb{ display:inline-block; width:32px; border-bottom:1px solid #999; height:15px; margin:0 4px 5px 0; }
.cnt{ font-size:11px; color:#999; margin-left:5px; }
.hintline{ font-size:11.5px; color:var(--orange); margin-top:2px; }
.empty{ color:#c0392b; font-style:italic; }
@media print{
  @page{ size:A4; margin:15mm 14mm; }
  body{ background:#fff; }
  header.top, .card, .previewhead, .noprint{ display:none !important; }
  .wrap{ display:block; margin:0; padding:0; max-width:none; }
  #sheet{ border:0; border-radius:0; padding:0; }
}
</style>
</head>
<body>
<header class="top">
  <h1>10-STEP 영어 지문 연습지 생성기 <span style="font-size:12px;opacity:.8">AI</span></h1>
  <span class="sub">시험범위 PDF·이미지 → 학교·학년 → 지침서대로 10STEP</span>
</header>

<div class="wrap">
  <div class="card noprint">
    <h2><span class="stepnum">1</span>시험범위 PDF·이미지 업로드 <span class="hint">(여러 장 선택 가능)</span></h2>
    <input type="file" id="pdfScope" accept="application/pdf,image/*" multiple class="file" onchange="extractTo(this,'scopeText')">
    <div id="exStatus" class="hint" style="margin-top:4px"></div>
    <label>추출된 범위 텍스트 <span class="hint">— PDF는 글자 추출, 이미지는 Claude가 읽어 옮깁니다. 생성할 지문만 남기세요</span></label>
    <textarea id="scopeText" style="min-height:150px" placeholder="여기에 시험범위 붙여넣기 또는 위에서 PDF/이미지 추출"></textarea>
    <label>문법 포인트 <span class="hint">(선택) — STEP 6·7 출제에 우선 반영</span></label>
    <textarea id="grammar" placeholder="예: 분사구문, 관계대명사, 수일치, 수동태"></textarea>

    <div class="sec">
    <h2><span class="stepnum">2</span>학교 · 학년 · 범위</h2>
    <div class="row2">
      <div><label>학교명</label><input type="text" id="school" placeholder="○○중학교"></div>
      <div><label>학년</label><input type="text" id="grade" placeholder="2학년"></div>
    </div>
    <label>출제 범위(상단 표기) <span class="hint">— 프린트 상단에 인쇄됩니다</span></label>
    <textarea id="examScope" placeholder="예: 1학기 중간 · 교과서 L5"></textarea>
    </div>

    <div class="sec">
    <h2><span class="stepnum">3</span>지침서대로 10STEP 완성</h2>
    <label>접근 코드 <span class="hint">— 학원에서 코드 설정 시 입력(선택)</span></label>
    <input type="password" id="accessCode" placeholder="(설정된 경우만)">
    <div id="msg" class="msg"></div>
    <div id="usage" class="hint" style="display:none;margin:6px 0 0"></div>
    <div class="btns">
      <button class="accent" id="genBtn" onclick="aiGenerate()">지침서대로 10STEP 생성</button>
      <button class="ghost" onclick="aiGenerate(true)" title="저장된 결과를 무시하고 AI로 다시 만듭니다(비용 발생)">새로 생성</button>
      <button class="ghost" onclick="window.print()">인쇄 · PDF 저장</button>
      <button class="ghost" onclick="saveWord()">Word로 저장</button>
    </div>
    <details style="margin-top:14px">
      <summary>AI 결과 직접 수정 (JSON)</summary>
      <p class="hint" style="margin:8px 0 0">아래 내용을 고친 뒤 [이 내용으로 다시 그리기]를 누르세요.</p>
      <textarea id="jsonBox" style="min-height:120px;font-family:monospace;font-size:12px"></textarea>
      <div class="btns"><button class="ghost" onclick="redrawFromJson()">이 내용으로 다시 그리기</button></div>
    </details>
    </div>
  </div>

  <div>
    <div class="previewhead noprint">
      <span class="t">미리보기</span>
      <span>
        <button class="ghost" onclick="window.print()">인쇄 · PDF 저장</button>
        <button class="ghost" onclick="saveWord()">Word로 저장</button>
      </span>
    </div>
    <div id="sheet">
      <div class="doctitle"><h1>10-STEP 영어 지문 연습지</h1><div class="sub">① 시험범위 PDF·이미지 → ② 학교·학년·범위 → ③ [지침서대로 10STEP 생성]</div></div>
    </div>
  </div>
</div>

<script>
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var PAREN=["(A)","(B)","(C)","(D)","(E)","(F)","(G)","(H)","(I)","(J)"];
var RESULT=null;
function txt(v){ if(v==null) return ""; if(typeof v==="string") return v; if(typeof v==="object"){ return String(v.text||v.sentence||v.eng||v.value||""); } return String(v); }
function txtArr(a){ return Array.isArray(a)?a.map(txt):[]; }
function normPassage(p){ p=p||{}; return { num:txt(p.num), type:txt(p.type), eng:txtArr(p.eng), kor:txtArr(p.kor), s3:txtArr(p.s3), s5:txtArr(p.s5), s6:txtArr(p.s6), s7:txt(p.s7), s7n:(parseInt(p.s7n,10)||0), s9:txtArr(p.s9), s10:txtArr(p.s10) }; }
function esc(s){ return txt(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function val(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function setMsg(kind,txt){ var m=document.getElementById("msg"); m.className="msg "+kind; m.textContent=txt; m.style.display="block"; }
function wc(sentence){ return txt(sentence).split(/\s+/).filter(function(x){return x.length;}).length; }

function fileToB64(f){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ var s=String(r.result||""); var i=s.indexOf(","); res(i>=0?s.slice(i+1):s); }; r.onerror=rej; r.readAsDataURL(f); }); }

async function extractTo(input, targetId){
  var files=input.files; if(!files || !files.length) return;
  var st=document.getElementById("exStatus");
  var t=document.getElementById(targetId);
  function isPdf(f){ return /pdf$/i.test(f.type||"") || /\.pdf$/i.test(f.name||""); }
  try{
    var pdfs=[], imgs=[];
    for(var k=0;k<files.length;k++){ (isPdf(files[k])?pdfs:imgs).push(files[k]); }
    for(var idx=0; idx<pdfs.length; idx++){
      if(!window.pdfjsLib){ alert("PDF 라이브러리를 불러오지 못했습니다(인터넷 확인)."); return; }
      if(st) st.textContent="PDF 글자 추출 중… ("+(idx+1)+"/"+pdfs.length+")";
      var buf=await pdfs[idx].arrayBuffer();
      var pdf=await pdfjsLib.getDocument({data:buf}).promise; var out="";
      for(var p=1;p<=pdf.numPages;p++){ var page=await pdf.getPage(p); var tc=await page.getTextContent(); out+=tc.items.map(function(it){return it.str;}).join(" ")+"\n"; }
      t.value=(t.value?t.value+"\n":"")+out.trim();
    }
    if(imgs.length){
      if(imgs.length>5){ if(st) st.textContent="이미지는 한 번에 5장까지 권장. 처음 5장만 처리합니다."; imgs=imgs.slice(0,5); }
      if(st) st.textContent="이미지를 Claude가 읽는 중… ("+imgs.length+"장)";
      var payload=[];
      for(var m=0;m<imgs.length;m++){ var b=await fileToB64(imgs[m]); payload.push({ data:b, mediaType:imgs[m].type||"image/png" }); }
      var resp=await fetch("/api/ocr",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ images:payload, accessCode:val("accessCode") }) });
      var data=await resp.json();
      if(!resp.ok){ if(st) st.textContent=""; alert("이미지 인식 실패: "+(data.error||resp.status)); return; }
      t.value=(t.value?t.value+"\n":"")+String(data.text||"").trim();
    }
    if(st) st.textContent="추출 완료. 필요한 지문만 남기세요.";
    input.value="";
  }catch(e){ if(st) st.textContent=""; alert("추출 실패: "+e.message); }
}

/* ===== 원문 조립 유틸 — AI는 '바꿀 단어'만 주고, 연습지는 여기서 원문으로 만든다 ===== */
function normText(t){ return txt(t).replace(/\s+/g," ").trim(); }
var ABBR=/^(Mr|Mrs|Ms|Dr|Prof|St|vs|etc|Fig|No|Jr|Sr)\.$/i;
function splitSentences(t){
  var s=normText(t); if(!s) return [];
  var toks=s.split(" "), out=[], buf="";
  for(var i=0;i<toks.length;i++){
    var w=toks[i];
    buf += (buf?" ":"")+w;
    if(!/[.!?]["')\]]?$/.test(w)) continue;
    if(ABBR.test(w)) continue;
    if(/^[A-Z]\.$/.test(w)) continue;          // 이니셜 J. 같은 것
    var nx=toks[i+1];
    if(!nx || /^["'(\[]?[A-Z0-9]/.test(nx)){ out.push(buf); buf=""; }
  }
  if(buf) out.push(buf);
  return out;
}
function sliceByAnchors(src, head, tail){
  var h=normText(head), t=normText(tail);
  if(!h) return "";
  var i=src.indexOf(h);
  if(i<0) i=src.toLowerCase().indexOf(h.toLowerCase());
  if(i<0) return "";
  if(!t) return src.slice(i);
  var j=src.indexOf(t, i);
  if(j<0) j=src.toLowerCase().indexOf(t.toLowerCase(), i);
  if(j<0) return "";
  return src.slice(i, j+t.length);
}
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function replaceWord(sent, word, repl){
  var w=txt(word).trim(); if(!w || !sent) return null;
  var pat="(^|[^A-Za-z])("+reEsc(w)+")([^A-Za-z]|$)";
  var re=new RegExp(pat);
  if(!re.test(sent)){ re=new RegExp(pat,"i"); if(!re.test(sent)) return null; }
  return sent.replace(re, function(m,a,b,c){ return a+repl+c; });
}
function pairAt(list, i){
  // 모델이 [["정답","오답"], ...] 로 줄 때와 문장별로 ["정답","오답"] 로 줄 때를 모두 받는다
  var v=Array.isArray(list)?list[i]:null;
  if(!Array.isArray(v)) return null;
  if(Array.isArray(v[0])) return (Array.isArray(v[0]) && v[0].length>=2) ? [txt(v[0][0]), txt(v[0][1])] : null;
  return v.length>=2 ? [txt(v[0]), txt(v[1])] : null;
}
function pairsAt(list, i){
  var v=Array.isArray(list)?list[i]:null;
  if(!Array.isArray(v)) return [];
  if(Array.isArray(v[0])) return v.filter(function(x){ return Array.isArray(x)&&x.length>=2; }).map(function(x){ return [txt(x[0]), txt(x[1])]; });
  return v.length>=2 ? [[txt(v[0]), txt(v[1])]] : [];
}
function wordsAt(list, i){
  var v=Array.isArray(list)?list[i]:null;
  if(!Array.isArray(v)) return [];
  if(Array.isArray(v[0])) { var out=[]; for(var k=0;k<v.length;k++){ if(Array.isArray(v[k])) out=out.concat(v[k].map(txt)); else out.push(txt(v[k])); } return out; }
  return v.map(txt);
}
function applyEdits(p, ed){
  ed=ed||{};
  var eng=p.eng, n=eng.length;
  p.kor=txtArr(ed.kor).slice(0,n);
  p.s10=txtArr(ed.s10).slice(0,n);
  var blanks=Array.isArray(ed.blanks)?ed.blanks:[], verbs=Array.isArray(ed.verbs)?ed.verbs:[], choices=Array.isArray(ed.choices)?ed.choices:[];
  p.s3=eng.map(function(s,i){
    var out=s, ws=wordsAt(blanks, i);
    for(var k=0;k<ws.length;k++){ var r=replaceWord(out, ws[k], "______"); if(r) out=r; }
    return out;
  });
  p.s5=eng.map(function(s,i){
    var out=s, vs=pairsAt(verbs, i);
    for(var k=0;k<vs.length;k++){ var r=replaceWord(out, vs[k][0], "( "+vs[k][1]+" )"); if(r) out=r; }
    return out;
  });
  p.s6=eng.map(function(s,i){
    var pr=pairAt(choices, i);
    if(!pr || !pr[0] || !pr[1]) return s;
    var box=(Math.random()<0.5)?("[ "+pr[0]+" / "+pr[1]+" ]"):("[ "+pr[1]+" / "+pr[0]+" ]");
    return replaceWord(s, pr[0], box) || s;
  });
  var para=eng.join(" "), errs=Array.isArray(ed.errors)?ed.errors:[], used=0;
  for(var e=0;e<errs.length && used<3;e++){
    var pe=errs[e]||[]; var r=replaceWord(para, pe[0], txt(pe[1]));
    if(r && r!==para){ para=r; used++; }
  }
  p.s7=para; p.s7n=used;
  var ranges=[], ch=Array.isArray(ed.chunks)?ed.chunks:[];
  for(var c=0;c<ch.length;c++){
    var a2=parseInt(ch[c] && ch[c][0],10), b2=parseInt(ch[c] && ch[c][1],10);
    if(!(a2>=1 && b2>=a2 && b2<=n)) { ranges=[]; break; }
    ranges.push([a2,b2]);
  }
  p.s9 = ranges.length>=2 ? ranges.map(function(r){ return eng.slice(r[0]-1, r[1]).join(" "); }) : [];
  return p;
}

/* ===== 사용량·비용 ===== */
var PRICES={ "claude-opus-5":[5,25], "claude-sonnet-5":[2,10], "claude-sonnet-4-6":[3,15], "claude-haiku-4-5":[1,5] };
var KRW=1400;
var USAGE={ inTok:0, outTok:0, calls:0, model:"" };
function resetUsage(){ USAGE={ inTok:0, outTok:0, calls:0, model:"" }; }
function addUsage(r){
  var u=r && r.data && r.data.usage;
  if(!u) return;
  USAGE.inTok+=(u.input||0); USAGE.outTok+=(u.output||0); USAGE.calls++;
  if(r.data.model) USAGE.model=r.data.model;
}
function usageCost(){
  var base=PRICES[USAGE.model]||PRICES["claude-sonnet-5"];
  return USAGE.inTok/1e6*base[0] + USAGE.outTok/1e6*base[1];
}
function usageText(){
  if(!USAGE.calls) return "";
  var usd=usageCost();
  return "AI 호출 "+USAGE.calls+"회 · 입력 "+USAGE.inTok.toLocaleString()+" · 출력 "+USAGE.outTok.toLocaleString()+" 토큰 ≈ 약 "+Math.round(usd*KRW).toLocaleString()+"원 ($"+usd.toFixed(3)+", "+(USAGE.model||"모델 미상")+")";
}
function showUsage(){ var el=document.getElementById("usage"); if(!el) return; var t=usageText(); el.textContent=t; el.style.display=t?"block":"none"; }

/* ===== 결과 캐시 — 같은 시험범위를 다시 누를 때 돈을 또 쓰지 않는다 ===== */
function cacheKey(text, gram){
  var s=normText(text)+"␀"+normText(gram), h=5381;
  for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; }
  return "ts10_"+(h>>>0).toString(36)+"_"+s.length;
}
function cacheLoad(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function cacheSave(k, obj){ try{ localStorage.setItem(k, JSON.stringify(obj)); }catch(e){ /* 용량 초과 등은 무시 */ } }

function step(title, inner){ return '<div class="stepblk"><div class="stitle">'+title+'</div>'+inner+'</div>'; }

function renderPassage(p){
  var eng=p.eng||[], kor=p.kor||[], s3=p.s3||[], s5=p.s5||[], s6=p.s6||[], s10=p.s10||[];
  var s7=p.s7||"", s9=p.s9||[];
  var num=p.num||"", type=p.type||"";
  var o=[];
  o.push('<div class="phead">지문 '+esc(num)+' <span class="ptype">'+(type?("["+esc(type)+"]"):"")+'</span></div>');
  o.push(step('STEP 1. 영어 + 해석', (function(){ var b=[]; for(var i=0;i<eng.length;i++){ b.push('<div class="s1row"><span class="n">'+(i+1)+'.</span> '+esc(eng[i])+'<br><span class="ko">'+esc(kor[i]||'')+'</span></div>'); } return b.join(''); })()));
  o.push(step('STEP 2. 영어 원문 → 해석 쓰기 (문장별)', (function(){ var b=[]; for(var i=0;i<eng.length;i++){ b.push('<div class="s2row"><span class="n">'+(i+1)+'.</span> '+esc(eng[i])+'<div class="wline"></div></div>'); } return b.join(''); })()));
  o.push(step('STEP 3. 해석 제시 → 빈칸(중요 명사·형용사) 채우기', (function(){ var b=[]; for(var i=0;i<eng.length;i++){ var line=s3[i]||eng[i]; b.push('<div class="s1row"><span class="n">'+(i+1)+'.</span> <span class="ko">'+esc(kor[i]||'')+'</span><br>'+esc(line)+'</div>'); } return b.join(''); })()));
  o.push(step('STEP 4. 영어 원문 → 해석 쓰기', (function(){ var b=[]; for(var i=0;i<eng.length;i++){ b.push('<div class="s2row"><span class="n">'+(i+1)+'.</span> '+esc(eng[i])+'<div class="wline"></div></div>'); } return b.join(''); })()));
  o.push(step('STEP 5. 동사를 원형으로 제시 → 알맞은 형태로 고치기', (function(){ var b=[]; for(var i=0;i<eng.length;i++){ var line=s5[i]||eng[i]; b.push('<div class="s2row"><span class="n">'+(i+1)+'.</span> '+esc(line)+'<div class="wline"></div></div>'); } return b.join(''); })()));
  o.push(step('STEP 6. 어법·어휘 보기 중 알맞은 것 고르기', (function(){ var b=[]; for(var i=0;i<eng.length;i++){ var line=s6[i]||eng[i]; b.push('<div class="s6row"><span class="n">'+(i+1)+'.</span> '+esc(line)+'</div>'); } return b.join(''); })()));
  o.push(step('STEP 7. 지문 속 어법상 틀린 곳 '+(p.s7n||3)+'군데 찾아 고치기', (function(){ var para=s7||eng.join(' '); return '<div class="para">'+esc(para)+'</div><div class="fixrow">① <span class="wb2"></span> → <span class="wb2"></span>&nbsp;&nbsp; ② <span class="wb2"></span> → <span class="wb2"></span>&nbsp;&nbsp; ③ <span class="wb2"></span> → <span class="wb2"></span></div>'; })()));
  o.push(step('STEP 8. 첫 문장에 이어질 문장 순서 배열', (function(){ if(eng.length<3){ return '<div class="empty">문장이 3개 이상일 때 배열됩니다.</div>'; } var first=eng[0], rest=shuffle(eng.slice(1)); var b=['<div class="given"><b>[주어진 문장]</b> '+esc(first)+'</div>']; for(var i=0;i<rest.length;i++){ b.push('<div class="s1row"><span class="lab">'+PAREN[i]+'</span> '+esc(rest[i])+'</div>'); } var ord=[]; for(var j=0;j<rest.length;j++){ ord.push('<span class="wb2"></span>'); } b.push('<div class="orderline">순서: '+ord.join(' → ')+'</div>'); return b.join(''); })()));
  o.push(step('STEP 9. 문단 순서 배열', (function(){ var chunks=(s9&&s9.length?s9.slice():[]); if(chunks.length<2){ var n=eng.length,g=Math.max(1,Math.ceil(n/3)),tmp=[]; for(var i=0;i<n;i+=g){ tmp.push(eng.slice(i,i+g).join(' ')); } chunks=tmp; } if(chunks.length<2){ return '<div class="empty">문단이 2개 이상일 때 배열됩니다.</div>'; } var sh=shuffle(chunks),b=[]; for(var k=0;k<sh.length;k++){ b.push('<div class="chunk"><span class="lab">'+PAREN[k]+'</span> '+esc(sh[k])+'</div>'); } var ord=[]; for(var m=0;m<sh.length;m++){ ord.push('<span class="wb2"></span>'); } b.push('<div class="orderline">순서: '+ord.join(' → ')+'</div>'); return b.join(''); })()));
  o.push(step('STEP 10. 영작 (해석 + 제시어, 빈칸 수 = 단어 수)', (function(){ var b=[]; for(var i=0;i<eng.length;i++){ var n=wc(eng[i]); var boxes=''; for(var j=0;j<n;j++){ boxes+='<span class="wb"></span>'; } var hint=s10[i]?('<div class="hintline">제시어: '+esc(s10[i])+'</div>'):''; b.push('<div class="s10row"><span class="n">'+(i+1)+'.</span> <span class="ko">'+esc(kor[i]||'')+'</span><div class="boxline">'+boxes+'<span class="cnt">('+n+' 단어)</span></div>'+hint+'</div>'); } return b.join(''); })()));
  return '<div class="pass">'+o.join('')+'</div>';
}

function examHeadHtml(){
  var school=val("school"), grade=val("grade"), es=val("examScope"), gr=val("grammar");
  var head=[];
  if(school||grade) head.push('<div class="line"><b>'+esc(school)+(grade?(' '+esc(grade)):'')+'</b></div>');
  if(es) head.push('<div class="line"><b>출제 범위</b> · '+esc(es)+'</div>');
  if(gr) head.push('<div class="line"><b>문법</b> · '+esc(gr)+'</div>');
  return head.length?('<div class="examhead">'+head.join('')+'</div>'):'';
}

function render(){
  var o=[];
  o.push('<div class="doctitle"><h1>10-STEP 영어 지문 연습지</h1><div class="sub">지침서 기준 자동 생성</div></div>');
  o.push(examHeadHtml());
  o.push('<div class="rulebox"><b>학습 안내</b> · 원문은 수정·삭제·축약 없이 사용합니다. STEP 7에는 어법 오류가 삽입되어 있습니다(개수는 지문마다 제목에 표시). 모든 STEP에 정답은 없습니다. 각 문장은 번호 옆 같은 줄에 작성하세요.</div>');
  if(!RESULT || !RESULT.passages || !RESULT.passages.length){
    o.push('<div class="rulebox">아직 생성된 지문이 없습니다. ③ [지침서대로 10STEP 생성]을 눌러주세요.</div>');
  } else {
    for(var i=0;i<RESULT.passages.length;i++){ o.push(renderPassage(RESULT.passages[i])); }
  }
  document.getElementById("sheet").innerHTML=o.join('');
}

function postGen(bodyObj){
  return fetch("/api/generate",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(bodyObj) })
    .then(function(resp){ return resp.json().then(function(d){ return { ok:resp.ok, status:resp.status, data:d }; }); });
}
function showGenError(r){ var d=r.data||{}; var em=d.error||("오류 "+r.status); if(d.stop_reason) em+=" (stop_reason: "+d.stop_reason+")"; if(d.raw) em+=" · 응답 일부: "+String(d.raw).slice(0,180); setMsg("err",em); }

async function aiGenerate(force){
  var text=val("scopeText");
  if(!text){ setMsg("err","시험범위 텍스트를 입력하거나 PDF/이미지에서 추출하세요."); return; }
  var btn=document.getElementById("genBtn"); btn.disabled=true;
  var gram=val("grammar"), code=val("accessCode");
  var key=cacheKey(text, gram);
  var store=(force?null:cacheLoad(key)) || { scan:null, done:{} };
  resetUsage(); showUsage();
  try{
    var found=store.scan;
    if(!found || !found.length){
      setMsg("load","1단계 · 지문 찾는 중… (첫 요청은 서버가 깨어나며 최대 1분)");
      var r0=await postGen({ text:text, accessCode:code, part:"scan" });
      addUsage(r0); showUsage();
      if(!r0.ok){ showGenError(r0); btn.disabled=false; return; }
      var src=normText(text), list=(r0.data.passages||[]), miss=[];
      found=[];
      for(var i=0;i<list.length;i++){
        var it=normPassage(list[i]);
        var eng=splitSentences(sliceByAnchors(src, (list[i]||{}).head, (list[i]||{}).tail));
        if(eng.length) found.push({ num:it.num||String(found.length+1), type:it.type, eng:eng });
        else miss.push({ num:it.num, type:it.type, head:txt((list[i]||{}).head), tail:txt((list[i]||{}).tail) });
      }
      if(miss.length){
        setMsg("load","1단계 · 원문을 못 찾은 지문 "+miss.length+"개 확인 중…");
        var rr=await postGen({ text:text, misses:miss, accessCode:code, part:"recover" });
        addUsage(rr); showUsage();
        if(rr.ok){
          var rec=(rr.data.passages||[]).map(normPassage);
          for(var m=0;m<rec.length;m++){ if(rec[m].eng.length) found.push({ num:rec[m].num||String(found.length+1), type:rec[m].type, eng:rec[m].eng }); }
        }
      }
      store.scan=found; store.done={}; cacheSave(key, store);
    } else {
      setMsg("load","1단계 · 저장된 지문 목록을 사용합니다(추가 비용 없음).");
    }
    if(!found.length){ setMsg("err","지문을 찾지 못했습니다. 텍스트에 영어 지문이 있는지 확인하세요."); btn.disabled=false; return; }

    var total=found.length, made=[], failed=0, reused=0, lastErr=null;
    RESULT={ passages:made };
    for(var i=0;i<total;i++){
      var hit=store.done && store.done[i];
      if(hit && hit.eng && hit.eng.length && hit.kor && hit.kor.length){
        made.push(hit); reused++;
        setMsg("load","2단계 · 지문 "+(i+1)+"/"+total+" · 저장된 결과 사용(비용 0)");
        render();
        continue;
      }
      var p={ num:found[i].num, type:found[i].type, eng:found[i].eng, kor:[], s3:[], s5:[], s6:[], s7:"", s7n:0, s9:[], s10:[] };
      setMsg("load","2단계 · 지문 "+(i+1)+"/"+total+" 연습지 만드는 중…");
      var rd=await postGen({ passage:{ num:p.num, type:p.type, eng:p.eng }, grammar:gram, accessCode:code, part:"detail" });
      addUsage(rd); showUsage();
      if(rd.ok){
        applyEdits(p, (rd.data.passages||[])[0]||{});
        store.done[i]=p; cacheSave(key, store);
      } else { failed++; lastErr=rd; }
      made.push(p);
      document.getElementById("jsonBox").value=JSON.stringify(RESULT,null,2);
      render();
    }
    document.getElementById("jsonBox").value=JSON.stringify(RESULT,null,2);
    render(); showUsage();
    var tail=(reused?(" · 저장된 지문 "+reused+"개는 다시 만들지 않았습니다"):"");
    if(failed){ if(lastErr) showGenError(lastErr); setMsg("err", total+"개 지문 중 "+failed+"개를 못 만들었습니다. 다시 누르면 실패한 지문만 새로 만듭니다."+tail); }
    else { setMsg("ok", total+"개 지문 생성 완료! 인쇄·PDF 또는 Word로 저장하세요."+tail); }
  }catch(e){
    setMsg("err","요청 실패: "+e.message+" · 무료 서버는 15분 미사용 후 첫 요청이 느릴 수 있어요. 30초~1분 뒤 다시 눌러보세요.");
  }
  btn.disabled=false;
}

function redrawFromJson(){
  try{ RESULT=JSON.parse(document.getElementById("jsonBox").value); if(RESULT&&Array.isArray(RESULT.passages)) RESULT.passages=RESULT.passages.map(normPassage); render(); setMsg("ok","다시 그렸습니다."); }
  catch(e){ setMsg("err","JSON 형식 오류: "+e.message); }
}

/* ===== Word(.docx) 저장: 데이터로 깔끔하게 조립 ===== */
function ul(n){ var s=""; for(var i=0;i<n;i++){ s+="____ "; } return s; }
function p8(){ return "________"; }
function wordPassage(p){
  var eng=p.eng||[], kor=p.kor||[], s3=p.s3||[], s5=p.s5||[], s6=p.s6||[], s10=p.s10||[];
  var s7=p.s7||"", s9=(p.s9&&p.s9.length?p.s9:[]);
  var num=p.num||"", type=p.type||"";
  var H=function(t){ return "<p style='background:#1a3a5c;color:#fff;font-weight:bold;padding:5px 8px;'>지문 "+esc(num)+" "+(type?("["+esc(type)+"]"):"")+"</p>"; };
  var S=function(t){ return "<p style='color:#2e6da4;font-weight:bold;border-bottom:1px solid #cfdae6;margin-top:12px;'>"+t+"</p>"; };
  var o=[H()];
  o.push(S("STEP 1. 영어 + 해석"));
  for(var i=0;i<eng.length;i++){ o.push("<p>"+(i+1)+". "+esc(eng[i])+"<br>"+esc(kor[i]||"")+"</p>"); }
  o.push(S("STEP 2. 영어 원문 → 해석 쓰기"));
  for(i=0;i<eng.length;i++){ o.push("<p>"+(i+1)+". "+esc(eng[i])+"</p><p style='border-bottom:1px solid #bbb'>&nbsp;</p>"); }
  o.push(S("STEP 3. 해석 제시 → 빈칸 채우기"));
  for(i=0;i<eng.length;i++){ o.push("<p>"+(i+1)+". "+esc(kor[i]||"")+"<br>"+esc(s3[i]||eng[i])+"</p>"); }
  o.push(S("STEP 4. 영어 원문 → 해석 쓰기"));
  for(i=0;i<eng.length;i++){ o.push("<p>"+(i+1)+". "+esc(eng[i])+"</p><p style='border-bottom:1px solid #bbb'>&nbsp;</p>"); }
  o.push(S("STEP 5. 동사를 원형으로 → 형태 고치기"));
  for(i=0;i<eng.length;i++){ o.push("<p>"+(i+1)+". "+esc(s5[i]||eng[i])+"</p><p style='border-bottom:1px solid #bbb'>&nbsp;</p>"); }
  o.push(S("STEP 6. 어법·어휘 보기 고르기"));
  for(i=0;i<eng.length;i++){ o.push("<p>"+(i+1)+". "+esc(s6[i]||eng[i])+"</p>"); }
  o.push(S("STEP 7. 어법상 틀린 곳 "+(p.s7n||3)+"군데 찾아 고치기"));
  o.push("<p>"+esc(s7||eng.join(" "))+"</p><p>① "+p8()+" → "+p8()+" &nbsp; ② "+p8()+" → "+p8()+" &nbsp; ③ "+p8()+" → "+p8()+"</p>");
  if(eng.length>=3){
    o.push(S("STEP 8. 첫 문장에 이어질 문장 순서 배열"));
    var rest=shuffle(eng.slice(1));
    o.push("<p><b>[주어진 문장]</b> "+esc(eng[0])+"</p>");
    for(i=0;i<rest.length;i++){ o.push("<p>"+PAREN[i]+" "+esc(rest[i])+"</p>"); }
    var ord=[]; for(i=0;i<rest.length;i++){ ord.push(p8()); } o.push("<p><b>순서: "+ord.join(" → ")+"</b></p>");
  }
  var chunks=s9.slice(); if(chunks.length<2){ var g=Math.max(1,Math.ceil(eng.length/3)),tmp=[]; for(i=0;i<eng.length;i+=g){ tmp.push(eng.slice(i,i+g).join(" ")); } chunks=tmp; }
  if(chunks.length>=2){
    o.push(S("STEP 9. 문단 순서 배열"));
    var sh=shuffle(chunks); for(i=0;i<sh.length;i++){ o.push("<p>"+PAREN[i]+" "+esc(sh[i])+"</p>"); }
    var ord2=[]; for(i=0;i<sh.length;i++){ ord2.push(p8()); } o.push("<p><b>순서: "+ord2.join(" → ")+"</b></p>");
  }
  o.push(S("STEP 10. 영작 (해석 + 제시어, 빈칸 수 = 단어 수)"));
  for(i=0;i<eng.length;i++){ var n=wc(eng[i]); o.push("<p>"+(i+1)+". "+esc(kor[i]||"")+" ("+n+" 단어)<br>"+ul(n)+"</p>"+(s10[i]?("<p style='color:#b5532a'>제시어: "+esc(s10[i])+"</p>"):"")); }
  return o.join("");
}
function buildWordHtml(){
  if(!RESULT || !RESULT.passages || !RESULT.passages.length) return null;
  var head="<h2 style='text-align:center;color:#1a3a5c'>10-STEP 영어 지문 연습지</h2>";
  var eh=examHeadHtml();
  var body=head+eh+"<p style='font-size:11px;color:#333'>원문은 수정·삭제·축약 없이 사용합니다. STEP 7에는 어법 오류가 삽입되어 있습니다(개수는 지문마다 제목에 표시). 정답은 없습니다.</p>";
  for(var i=0;i<RESULT.passages.length;i++){ body+="<div style='page-break-before:always'>"+wordPassage(RESULT.passages[i])+"</div>"; }
  return "<!DOCTYPE html><html><head><meta charset='utf-8'></head><body style=\"font-family:'Malgun Gothic',sans-serif;font-size:13px;line-height:1.5\">"+body+"</body></html>";
}
function download(blob, name){ var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
async function saveWord(){
  if(!RESULT || !RESULT.passages || !RESULT.passages.length){ alert('먼저 연습지를 생성하세요.'); return; }
  setMsg("load","Word 문서 만드는 중…");
  try{
    var body={ passages:RESULT.passages, school:val("school"), grade:val("grade"), examScope:val("examScope"), grammar:val("grammar"), accessCode:val("accessCode") };
    var resp=await fetch("/api/docx",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body) });
    if(!resp.ok){ var d={}; try{ d=await resp.json(); }catch(e){} setMsg("err","Word 저장 실패: "+(d.error||resp.status)); return; }
    var blob=await resp.blob();
    download(blob, "10step_연습지.docx");
    setMsg("ok","Word 파일(.docx)을 저장했습니다.");
  }catch(e){ setMsg("err","Word 저장 실패: "+e.message); }
}
